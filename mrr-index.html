<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MRR進捗ダッシュボード</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Segoe UI", "Hiragino Sans", "Meiryo", sans-serif;
    background:
      radial-gradient(circle at 12% 12%, rgba(26, 115, 232, 0.13), transparent 30%),
      linear-gradient(135deg, #f7fbff 0%, #eef4f8 46%, #f8fafc 100%);
    color: #172033;
  }
  .hidden { display: none !important; }
  .loading {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(248, 250, 252, 0.88);
    color: #1a73e8;
    font-weight: 700;
  }
  .choice-shell {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px;
  }
  .choice-panel {
    width: min(920px, 100%);
    padding: 36px;
    border-radius: 28px;
    background: rgba(255, 255, 255, 0.88);
    box-shadow: 0 24px 70px rgba(15, 23, 42, 0.14);
  }
  .choice-kicker {
    margin: 0 0 8px;
    color: #1a73e8;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 0.08em;
  }
  .choice-title {
    margin: 0;
    font-size: clamp(30px, 5vw, 52px);
    letter-spacing: -0.05em;
  }
  .choice-note {
    margin: 14px 0 28px;
    color: #64748b;
  }
  .choice-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 14px;
  }
  .choice-card {
    min-height: 150px;
    padding: 20px;
    border: 1px solid rgba(148, 163, 184, 0.28);
    border-radius: 20px;
    background: #ffffff;
    text-align: left;
    cursor: pointer;
    transition: transform 140ms ease, box-shadow 140ms ease, border-color 140ms ease;
  }
  .choice-card:hover {
    transform: translateY(-3px);
    border-color: #1a73e8;
    box-shadow: 0 18px 42px rgba(26, 115, 232, 0.16);
  }
  .choice-name {
    display: block;
    margin-bottom: 12px;
    font-size: 30px;
    font-weight: 900;
    color: #172033;
  }
  .choice-desc {
    color: #64748b;
    line-height: 1.6;
  }
  .app-shell {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .header {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 16px 24px;
    background: rgba(255, 255, 255, 0.92);
    border-bottom: 1px solid rgba(148, 163, 184, 0.22);
    backdrop-filter: blur(16px);
  }
  .header-left,
  .header-right {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  h1 {
    margin: 0;
    font-size: 20px;
    color: #1a73e8;
    letter-spacing: -0.02em;
  }
  .tabs {
    display: inline-flex;
    gap: 6px;
    padding: 4px;
    border-radius: 999px;
    background: #e8eef8;
  }
  .tab {
    padding: 8px 14px;
    border: 0;
    border-radius: 999px;
    background: transparent;
    color: #475569;
    cursor: pointer;
    font-size: 13px;
    font-weight: 800;
  }
  .tab.active {
    background: #1a73e8;
    color: #ffffff;
    box-shadow: 0 8px 18px rgba(26, 115, 232, 0.25);
  }
  .selector,
  .week-nav {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .selector label,
  .week-label {
    font-size: 13px;
    font-weight: 800;
  }
  .selector select {
    min-width: 160px;
    padding: 7px 10px;
    border: 1px solid #cbd5e1;
    border-radius: 10px;
    background: #ffffff;
    font-size: 13px;
  }
  .week-btn,
  .load-more-btn {
    border: 1px solid #cbd5e1;
    border-radius: 10px;
    background: #ffffff;
    cursor: pointer;
    font-weight: 800;
  }
  .week-btn {
    width: 32px;
    height: 32px;
  }
  .week-label {
    min-width: 92px;
    text-align: center;
  }
  .content {
    width: min(1540px, calc(100vw - 32px));
    margin: 0 auto;
    padding: 24px 0 36px;
  }
  .meta-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
    color: #64748b;
    font-size: 13px;
  }
  .load-more-btn {
    padding: 8px 14px;
    color: #1a73e8;
  }
  .period-panel {
    display: grid;
    gap: 8px;
    margin-bottom: 16px;
    padding: 14px 16px;
    border: 1px solid rgba(148, 163, 184, 0.22);
    border-radius: 18px;
    background: rgba(255, 255, 255, 0.78);
    box-shadow: 0 12px 28px rgba(15, 23, 42, 0.05);
  }
  .period-row {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .period-label {
    min-width: 54px;
    color: #475569;
    font-size: 12px;
    font-weight: 900;
  }
  .period-chips {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .period-chip {
    padding: 7px 12px;
    border: 1px solid #cbd5e1;
    border-radius: 999px;
    background: #ffffff;
    color: #475569;
    cursor: pointer;
    font-size: 12px;
    font-weight: 900;
  }
  .period-chip.active {
    border-color: #1a73e8;
    background: #1a73e8;
    color: #ffffff;
    box-shadow: 0 8px 18px rgba(26, 115, 232, 0.22);
  }
  .cards {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 14px;
    margin-bottom: 18px;
  }
  .card {
    padding: 16px 18px;
    border-radius: 18px;
    background: #ffffff;
    box-shadow: 0 14px 34px rgba(15, 23, 42, 0.08);
  }
  .card-label {
    margin-bottom: 8px;
    color: #64748b;
    font-size: 12px;
    font-weight: 700;
  }
  .card-value {
    font-size: 28px;
    font-weight: 900;
    letter-spacing: -0.03em;
  }
  .card-sub {
    margin-top: 8px;
    font-size: 12px;
  }
  .val-pos { color: #15803d; }
  .val-neg { color: #dc2626; }
  .val-neutral { color: #172033; }
  .panel {
    border-radius: 20px;
    background: #ffffff;
    box-shadow: 0 18px 46px rgba(15, 23, 42, 0.09);
  }
  .chart-panel {
    min-height: 560px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .chart-panel canvas {
    width: 100%;
    min-height: 520px;
  }
  .filter-chip {
    min-height: 28px;
    margin-bottom: 10px;
  }
  .filter-chip-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    border-radius: 999px;
    background: #e8f0fe;
    color: #1a73e8;
    font-size: 12px;
    font-weight: 800;
  }
  .filter-chip-clear {
    border: 0;
    background: transparent;
    color: inherit;
    cursor: pointer;
    font-size: 14px;
  }
  .deal-panel {
    overflow: hidden;
  }
  .deal-scroll {
    max-height: 520px;
    overflow: auto;
  }
  .deal-table {
    width: 100%;
    border-collapse: collapse;
  }
  .deal-table th,
  .deal-table td {
    padding: 11px 12px;
    border-bottom: 1px solid #e5e7eb;
    text-align: left;
    white-space: nowrap;
    font-size: 13px;
  }
  .deal-table th {
    position: sticky;
    top: 0;
    z-index: 1;
    background: #f8fafc;
    color: #334155;
    cursor: pointer;
  }
  .deal-table tr.pos { background: #f0fdf4; }
  .deal-table tr.neg { background: #fef2f2; }
  .empty-state {
    padding: 48px 24px;
    text-align: center;
    color: #64748b;
  }
  @media (max-width: 1100px) {
    .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .choice-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 720px) {
    .header { align-items: flex-start; padding: 14px 16px; }
    .content { width: calc(100vw - 20px); padding-top: 16px; }
    .cards,
    .choice-grid { grid-template-columns: 1fr; }
    .chart-panel { min-height: 420px; }
    .chart-panel canvas { min-height: 380px; }
  }
</style>
</head>
<body>
<div id="loading" class="loading hidden">読込中...</div>

<section id="choiceShell" class="choice-shell hidden">
  <div class="choice-panel">
    <p class="choice-kicker">MRR DASHBOARD</p>
    <h2 class="choice-title">表示する事業部を選択</h2>
    <p class="choice-note">選択後は専用URLに切り替わります。初期表示では現在値だけを読み込み、履歴は必要な時だけ追加取得します。</p>
    <div class="choice-grid" id="choiceGrid"></div>
  </div>
</section>

<div id="appShell" class="app-shell hidden">
  <header class="header">
    <div class="header-left">
      <h1>MRR進捗ダッシュボード</h1>
      <div class="tabs" id="divisionTabs"></div>
      <div class="tabs">
        <button type="button" class="tab active" data-view="weekly" onclick="switchView('weekly')">週次</button>
        <button type="button" class="tab" data-view="dept" onclick="switchView('dept')">部署別</button>
      </div>
    </div>
    <div class="header-right">
      <div class="selector" id="deptSelector">
        <label for="deptSelect">部署</label>
        <select id="deptSelect" onchange="chartFilter = null; render();"></select>
      </div>
      <div class="week-nav" id="weekSelector" style="display:none;">
        <button type="button" class="week-btn" onclick="moveWeek(-1)" aria-label="前の日付">‹</button>
        <span id="weekLabel" class="week-label"></span>
        <button type="button" class="week-btn" onclick="moveWeek(1)" aria-label="次の日付">›</button>
      </div>
    </div>
  </header>

  <main class="content">
    <section class="period-panel" id="periodControls"></section>
    <div class="meta-row">
      <span id="historyMeta"></span>
      <button type="button" id="loadMoreBtn" class="load-more-btn hidden" onclick="loadMoreSnapshots_()">さらに過去を読み込む</button>
    </div>
    <section class="cards" id="cards"></section>
    <section class="panel chart-panel">
      <canvas id="mainChart"></canvas>
    </section>
    <div id="filterChip" class="filter-chip"></div>
    <section class="panel deal-panel" id="dealArea"></section>
  </main>
</div>

<script>
var GAS_MRR_INITIAL_DIVISION = '<?= mrrInitialDivision ?>';
var GAS_MRR_WEBAPP_URL = '<?= mrrWebAppUrl ?>';
var DIVISION_CHOICES = [
  { key: 'SS', label: 'SS', description: 'SS事業部' },
  { key: 'BO', label: 'BO', description: 'BO事業部' },
  { key: 'CO', label: 'CO', description: 'CO事業部' },
  { key: 'COO', label: 'COO', description: '全事業部' }
];
var D = null;
var chart = null;
var currentDivision = getInitialDivision_();
var currentView = 'weekly';
var currentWeekIdx = 0;
var chartFilter = null;
var dealSortKey = '';
var dealSortAsc = true;
var dealCache = {};
var dealErrorCache = {};
var loadingDealKey = '';
var loadingHistory = false;
var snapshotLoadError = '';
var snapshotHistoryLoaded = false;
var selectedQuarterKey = '';
var selectedPeriod = '';
var MRR_LIVE_WEEK_KEY = 'live';

function getInitialDivision_() {
  var embedded = normalizeDivision_(GAS_MRR_INITIAL_DIVISION || '');
  if (embedded) return embedded;
  try {
    var value = String(new URLSearchParams(window.location.search || '').get('division') || '').toUpperCase();
    return normalizeDivision_(value);
  } catch (e) {
    return '';
  }
}

function normalizeDivision_(value) {
  value = String(value || '').trim().toUpperCase();
  return DIVISION_CHOICES.some(function(choice) { return choice.key === value; }) ? value : '';
}

function showSelection_() {
  document.getElementById('choiceShell').classList.remove('hidden');
  document.getElementById('appShell').classList.add('hidden');
  hideLoading_();
  var grid = document.getElementById('choiceGrid');
  grid.innerHTML = DIVISION_CHOICES.map(function(choice) {
    return '<button type="button" class="choice-card" onclick="goDivision_(\'' + choice.key + '\')">' +
      '<span class="choice-name">' + escapeHtml_(choice.label) + '</span>' +
      '<span class="choice-desc">' + escapeHtml_(choice.description) + '</span>' +
    '</button>';
  }).join('');
}

function goDivision_(division) {
  var baseUrl = GAS_MRR_WEBAPP_URL || window.location.href;
  var url = new URL(baseUrl);
  url.searchParams.set('app', 'mrr');
  url.searchParams.set('division', division);
  try {
    window.top.location.href = url.toString();
  } catch (e) {
    window.location.href = url.toString();
  }
}

function showApp_() {
  document.getElementById('choiceShell').classList.add('hidden');
  document.getElementById('appShell').classList.remove('hidden');
}

function showLoading_(message) {
  var el = document.getElementById('loading');
  el.textContent = message || '読込中...';
  el.classList.remove('hidden');
}

function hideLoading_() {
  document.getElementById('loading').classList.add('hidden');
}

function bootstrap_() {
  buildDivisionTabs_();
  if (!currentDivision) {
    showSelection_();
    return;
  }
  showApp_();
  loadCurrentData_(currentDivision);
}

function buildDivisionTabs_() {
  var tabs = document.getElementById('divisionTabs');
  if (!tabs) return;
  tabs.innerHTML = DIVISION_CHOICES.map(function(choice) {
    return '<button type="button" class="tab" data-division="' + choice.key + '" onclick="goDivision_(\'' + choice.key + '\')">' +
      escapeHtml_(choice.label) +
    '</button>';
  }).join('');
}

function loadCurrentData_(division) {
  loadingHistory = false;
  snapshotLoadError = '';
  snapshotHistoryLoaded = false;
  dealCache = {};
  dealErrorCache = {};
  loadingDealKey = '';
  showLoading_('現在値を読み込み中...');
  google.script.run
    .withSuccessHandler(function(result) {
      try {
        D = normalizeResult_(result || {});
        syncPeriodStateFromData_();
        currentWeekIdx = D.weeks.length ? D.weeks.length - 1 : 0;
        currentDivision = D.division || division;
        chartFilter = null;
        updateDivisionTabs_();
        buildDeptOptions_();
        updateWeekLabel();
        hideLoading_();
        render();
      } catch (e) {
        showLoading_('描画エラー: ' + getErrorMessage_(e));
      }
    })
    .withFailureHandler(function(err) {
      showLoading_('エラー: ' + getErrorMessage_(err));
    })
    .getMrrDashboardCurrentData(division, selectedPeriod || '');
}

function loadSnapshotData_(division, beforeDate) {
  loadingHistory = true;
  snapshotLoadError = '';
  renderHistoryMeta_();
  google.script.run
    .withSuccessHandler(function(result) {
      mergeDashboardData_(normalizeResult_(result || {}));
      syncPeriodStateFromData_();
      snapshotHistoryLoaded = true;
      currentDivision = D.division || division;
      chartFilter = null;
      updateDivisionTabs_();
      buildDeptOptions_();
      updateWeekLabel();
      loadingHistory = false;
      render();
    })
    .withFailureHandler(function(err) {
      loadingHistory = false;
      snapshotLoadError = getErrorMessage_(err);
      renderHistoryMeta_();
    })
    .getMrrDashboardData(division, beforeDate || '', selectedPeriod || '');
}

function normalizeResult_(result) {
  return {
    division: result.division || currentDivision,
    divisionLabel: result.divisionLabel || result.division || currentDivision,
    choices: Array.isArray(result.choices) ? result.choices : DIVISION_CHOICES,
    totalDeptKey: result.totalDeptKey || currentDivision,
    allLabel: result.allLabel || (currentDivision + '全体'),
    metricDefinitions: Array.isArray(result.metricDefinitions) ? result.metricDefinitions.slice() : [],
    periodOptions: Array.isArray(result.periodOptions) ? result.periodOptions.slice() : [],
    selectedPeriod: result.selectedPeriod || '',
    selectedQuarterKey: result.selectedQuarterKey || '',
    weeks: sortWeeks_(Array.isArray(result.weeks) ? result.weeks.slice() : []),
    weekLabels: result.weekLabels || {},
    depts: Array.isArray(result.depts) ? result.depts.slice() : [],
    data: result.data || {},
    diagnostics: result.diagnostics || { current: [] },
    history: result.history || { hasMore: false, oldestDate: '' }
  };
}

function mergeDashboardData_(incoming) {
  incoming.weeks.forEach(function(week) {
    if (D.weeks.indexOf(week) === -1) D.weeks.push(week);
  });
  D.weeks = sortWeeks_(D.weeks);
  Object.keys(incoming.weekLabels || {}).forEach(function(key) {
    D.weekLabels[key] = incoming.weekLabels[key];
  });
  incoming.depts.forEach(function(dept) {
    if (D.depts.indexOf(dept) === -1) D.depts.push(dept);
  });
  Object.keys(incoming.data || {}).forEach(function(week) {
    if (!D.data[week]) D.data[week] = {};
    Object.keys(incoming.data[week] || {}).forEach(function(dept) {
      D.data[week][dept] = incoming.data[week][dept];
    });
  });
  if (incoming.diagnostics && Array.isArray(incoming.diagnostics.current) && incoming.diagnostics.current.length) {
    D.diagnostics = D.diagnostics || {};
    D.diagnostics.current = incoming.diagnostics.current.slice();
  }
  if (incoming.periodOptions && incoming.periodOptions.length) D.periodOptions = incoming.periodOptions.slice();
  if (incoming.selectedPeriod) D.selectedPeriod = incoming.selectedPeriod;
  if (incoming.selectedQuarterKey) D.selectedQuarterKey = incoming.selectedQuarterKey;
  D.history = incoming.history || D.history;
  currentWeekIdx = D.weeks.length ? D.weeks.length - 1 : 0;
}

function syncPeriodStateFromData_() {
  if (!D) return;
  var options = Array.isArray(D.periodOptions) ? D.periodOptions : [];
  var nextQuarter = selectedQuarterKey || D.selectedQuarterKey || (options[0] && options[0].key) || '';
  if (!getMrrQuarterOption_(options, nextQuarter)) {
    nextQuarter = D.selectedQuarterKey || (options[0] && options[0].key) || '';
  }

  var nextPeriod = selectedPeriod || D.selectedPeriod || nextQuarter;
  if (!isValidMrrPeriod_(options, nextPeriod)) {
    nextPeriod = D.selectedPeriod || nextQuarter;
  }
  if (!isValidMrrPeriod_(options, nextPeriod)) {
    nextPeriod = nextQuarter;
  }

  selectedPeriod = nextPeriod || '';
  selectedQuarterKey = getMrrQuarterKeyForPeriod_(options, selectedPeriod) || nextQuarter || '';
  D.selectedPeriod = selectedPeriod;
  D.selectedQuarterKey = selectedQuarterKey;
}

function getMrrQuarterOption_(periodOptions, quarterKey) {
  var key = String(quarterKey || '');
  return (periodOptions || []).find(function(option) {
    return option && option.key === key;
  }) || null;
}

function getMrrQuarterKeyForPeriod_(periodOptions, periodKey) {
  var key = String(periodKey || '');
  var option = (periodOptions || []).find(function(item) {
    return item && (item.key === key || (item.months || []).indexOf(key) !== -1);
  });
  return option ? option.key : '';
}

function isValidMrrPeriod_(periodOptions, periodKey) {
  var key = String(periodKey || '');
  if (!key) return false;
  return (periodOptions || []).some(function(option) {
    return option && (option.key === key || (option.months || []).indexOf(key) !== -1);
  });
}

function selectMrrQuarter_(quarterKey) {
  if (!D || selectedQuarterKey === quarterKey && selectedPeriod === quarterKey) return;
  selectedQuarterKey = quarterKey;
  selectedPeriod = quarterKey;
  reloadForPeriod_();
}

function selectMrrPeriod_(periodKey) {
  if (!D || selectedPeriod === periodKey) return;
  selectedPeriod = periodKey;
  selectedQuarterKey = getMrrQuarterKeyForPeriod_(D.periodOptions || [], periodKey) || selectedQuarterKey;
  reloadForPeriod_();
}

function reloadForPeriod_() {
  chartFilter = null;
  dealCache = {};
  loadingDealKey = '';
  loadCurrentData_(currentDivision);
}

function sortWeeks_(weeks) {
  return (weeks || []).slice().sort(function(a, b) {
    if (a === MRR_LIVE_WEEK_KEY && b !== MRR_LIVE_WEEK_KEY) return 1;
    if (b === MRR_LIVE_WEEK_KEY && a !== MRR_LIVE_WEEK_KEY) return -1;
    return a < b ? -1 : (a > b ? 1 : 0);
  });
}

function updateDivisionTabs_() {
  document.querySelectorAll('[data-division]').forEach(function(tab) {
    tab.classList.toggle('active', tab.dataset.division === currentDivision);
  });
}

function getErrorMessage_(err) {
  if (!err) return 'Unknown error';
  return err.message || err.toString() || 'Unknown error';
}

function buildDeptOptions_() {
  var select = document.getElementById('deptSelect');
  if (!select || !D) return;
  select.innerHTML = '';
  [D.allLabel].concat(D.depts || []).forEach(function(dept) {
    var option = document.createElement('option');
    option.value = dept;
    option.textContent = dept;
    select.appendChild(option);
  });
}

function getSelectedDept_() {
  var select = document.getElementById('deptSelect');
  return select && select.value ? select.value : (D && D.allLabel) || '';
}

function getSelectedWeek_() {
  if (!D || !D.weeks.length) return '';
  return D.weeks[currentWeekIdx] || '';
}

function getWeekLabel_(weekKey) {
  return (D && D.weekLabels && D.weekLabels[weekKey]) || weekKey || '';
}

function updateWeekLabel() {
  var label = document.getElementById('weekLabel');
  if (label) label.textContent = getWeekLabel_(getSelectedWeek_()) || '-';
}

function moveWeek(direction) {
  if (!D || !D.weeks.length) return;
  currentWeekIdx = Math.max(0, Math.min(D.weeks.length - 1, currentWeekIdx + direction));
  chartFilter = null;
  updateWeekLabel();
  render();
}

function switchView(view) {
  currentView = view;
  chartFilter = null;
  document.querySelectorAll('[data-view]').forEach(function(tab) {
    tab.classList.toggle('active', tab.dataset.view === view);
  });
  document.getElementById('deptSelector').style.display = view === 'weekly' ? '' : 'none';
  document.getElementById('weekSelector').style.display = view === 'dept' ? '' : 'none';
  render();
}

function loadMoreSnapshots_() {
  if (!D || loadingHistory) return;
  if (!snapshotHistoryLoaded) {
    loadSnapshotData_(currentDivision, '');
    return;
  }
  if (!D.history || !D.history.hasMore || !D.history.oldestDate) return;
  loadSnapshotData_(currentDivision, D.history.oldestDate);
}

function render() {
  if (!D) return;
  renderPeriodControls_();
  renderHistoryMeta_();
  renderCards();
  renderChartSafely_();
  renderDeals();
}

function renderChartSafely_() {
  try {
    renderChart();
  } catch (e) {
    renderChartError_('グラフ描画エラー: ' + getErrorMessage_(e));
  }
}

function renderPeriodControls_() {
  var area = document.getElementById('periodControls');
  if (!area || !D) return;
  var options = D.periodOptions || [];
  if (!options.length) {
    area.innerHTML = '<div class="period-row"><span class="period-label">対象</span><span>対象Q / 対象月がありません</span></div>';
    return;
  }
  var selectedQuarter = getMrrQuarterOption_(options, selectedQuarterKey) || options[0];
  var quarterHtml = options.map(function(option) {
    var key = String(option.key || '');
    return '<button type="button" class="period-chip' + (selectedQuarterKey === key ? ' active' : '') + '" onclick="selectMrrQuarter_(\'' + escapeJsString_(key) + '\')">' +
      escapeHtml_(option.label || key) +
    '</button>';
  }).join('');
  var monthHtml = '';
  if (selectedQuarter) {
    monthHtml += '<button type="button" class="period-chip' + (selectedPeriod === selectedQuarter.key ? ' active' : '') + '" onclick="selectMrrPeriod_(\'' + escapeJsString_(selectedQuarter.key) + '\')">' +
      escapeHtml_(selectedQuarter.label || selectedQuarter.key) +
    '</button>';
    (selectedQuarter.months || []).forEach(function(monthKey) {
      monthHtml += '<button type="button" class="period-chip' + (selectedPeriod === monthKey ? ' active' : '') + '" onclick="selectMrrPeriod_(\'' + escapeJsString_(monthKey) + '\')">' +
        escapeHtml_(formatMrrMonthLabel_(monthKey)) +
      '</button>';
    });
  }
  area.innerHTML =
    '<div class="period-row"><span class="period-label">対象Q:</span><div class="period-chips">' + quarterHtml + '</div></div>' +
    '<div class="period-row"><span class="period-label">対象月:</span><div class="period-chips">' + monthHtml + '</div></div>';
}

function renderHistoryMeta_() {
  var meta = document.getElementById('historyMeta');
  var button = document.getElementById('loadMoreBtn');
  if (!meta || !button) return;
  var snapshotCount = getSnapshotCount_();
  var parts = [(D.divisionLabel || D.division)];
  if (selectedPeriod) parts.push('対象: ' + getMrrPeriodLabel_(selectedPeriod));
  if (D.weeks.indexOf(MRR_LIVE_WEEK_KEY) !== -1) parts.push('現在値表示中');
  parts.push('スナップショット: ' + (snapshotHistoryLoaded ? snapshotCount + '日付' : '未読込'));
  var currentWarnings = getCurrentDiagnosticWarnings_();
  if (currentWarnings.length) parts.push('現在値警告: ' + currentWarnings.join(', '));
  if (loadingHistory) parts.push('スナップショット準備中');
  if (snapshotLoadError) parts.push('履歴エラー: ' + snapshotLoadError);
  meta.textContent = parts.join(' / ');
  button.textContent = !snapshotHistoryLoaded ? '履歴を読み込む' : 'さらに過去を読み込む';
  var canLoadMore = D.history && D.history.hasMore && D.history.oldestDate;
  button.classList.toggle('hidden', loadingHistory || !(!snapshotHistoryLoaded || canLoadMore));
}

function getSnapshotCount_() {
  return D && Array.isArray(D.weeks)
    ? D.weeks.filter(function(week) { return week !== MRR_LIVE_WEEK_KEY; }).length
    : 0;
}

function getCurrentDiagnosticWarnings_() {
  var rows = D && D.diagnostics && Array.isArray(D.diagnostics.current)
    ? D.diagnostics.current
    : [];
  return rows.filter(function(item) {
    return item && item.status !== 'ok';
  }).map(function(item) {
    var reason = item.reason || item.error || 'unknown';
    return (item.deptKey || '-') + ':' + reason;
  });
}

function emptyMetric_() {
  return { target: 0, actual: 0, expectedMrr: 0, fcst: 0 };
}

function getWeekMap_(week) {
  return (D && D.data && D.data[week]) || {};
}

function getDeptData(week, dept) {
  var rows = getWeekMap_(week);
  if (!D) return emptyMetric_();
  if (dept === D.allLabel) return rows[D.totalDeptKey] || emptyMetric_();
  return rows[dept] || emptyMetric_();
}

function getMetricDefinitions_() {
  return (D && Array.isArray(D.metricDefinitions)) ? D.metricDefinitions : [];
}

function renderCards() {
  var area = document.getElementById('cards');
  if (!area) return;
  if (!D.weeks.length) {
    var warnings = getCurrentDiagnosticWarnings_();
    var detail = warnings.length ? warnings.join(' / ') : '現在値の対象データがありません';
    area.innerHTML = '<div class="card"><div class="card-label">状態</div><div class="card-value">現在値未取得</div><div class="card-sub val-neg">' + escapeHtml_(detail) + '</div></div>';
    return;
  }
  var data = currentView === 'weekly'
    ? getDeptData(D.weeks[D.weeks.length - 1], getSelectedDept_())
    : getDeptData(getSelectedWeek_(), D.allLabel);
  var defs = getMetricDefinitions_();
  var target = Number(data.target) || 0;
  area.innerHTML = defs.map(function(def) {
    var value = Number(data[def.key]) || 0;
    var sub = '';
    var subClass = 'val-neutral';
    if (def.key !== 'target' && target) {
      var diff = value - target;
      sub = 'vs 目標 ' + (diff >= 0 ? '+' : '') + fmt(diff);
      subClass = diff >= 0 ? 'val-pos' : 'val-neg';
    }
    return buildCardHtml_(def.label || def.key, fmt(value), sub, valClass_(value), subClass);
  }).join('');
}

function buildCardHtml_(label, value, sub, valueClass, subClass) {
  return '<div class="card">' +
    '<div class="card-label">' + escapeHtml_(label) + '</div>' +
    '<div class="card-value ' + escapeHtml_(valueClass || 'val-neutral') + '">' + escapeHtml_(value) + '</div>' +
    (sub ? '<div class="card-sub ' + escapeHtml_(subClass || 'val-neutral') + '">' + escapeHtml_(sub) + '</div>' : '') +
  '</div>';
}

function renderChart() {
  var canvas = document.getElementById('mainChart');
  if (!canvas || !D) return;
  clearChartError_();
  if (typeof Chart !== 'function') {
    renderChartError_('グラフライブラリを読み込めませんでした。数値とKey Dealは表示しています。');
    return;
  }
  if (chart) chart.destroy();
  if (!D.weeks.length) return;

  var ctx = canvas.getContext('2d');
  var options = buildChartOptions_();
  if (currentView === 'weekly') {
    var dept = getSelectedDept_();
    var rows = D.weeks.map(function(week) { return getDeptData(week, dept); });
    chart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: D.weeks.map(getWeekLabel_),
        datasets: buildMetricDatasets_(rows)
      },
      options: Object.assign(options, {
        onClick: function(_, elements) {
          chartFilter = elements.length
            ? toggleFilter_('week', D.weeks[elements[0].index])
            : null;
          renderDeals();
        }
      })
    });
    return;
  }

  var week = getSelectedWeek_();
  var targets = D.depts.map(function(dept) { return getDeptData(week, dept).target || 0; });
  chart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: D.depts,
      datasets: buildMetricDatasets_(D.depts.map(function(dept) { return getDeptData(week, dept); }))
    },
    options: Object.assign(options, {
      onClick: function(_, elements) {
        chartFilter = elements.length
          ? toggleFilter_('dept', D.depts[elements[0].index])
          : null;
        renderDeals();
      }
    }),
    plugins: [makeTargetTickPlugin_('targetTicks', targets)]
  });
}

function clearChartError_() {
  var canvas = document.getElementById('mainChart');
  if (canvas) canvas.style.display = '';
  var err = document.getElementById('chartError');
  if (err && err.parentNode) err.parentNode.removeChild(err);
}

function renderChartError_(message) {
  if (chart) {
    try { chart.destroy(); } catch (e) {}
    chart = null;
  }
  var canvas = document.getElementById('mainChart');
  if (canvas) canvas.style.display = 'none';
  var panel = document.querySelector('.chart-panel');
  if (!panel) return;
  var err = document.getElementById('chartError');
  if (!err) {
    err = document.createElement('div');
    err.id = 'chartError';
    err.className = 'empty-state';
    panel.appendChild(err);
  }
  err.textContent = message;
}

function toggleFilter_(type, value) {
  return chartFilter && chartFilter.type === type && chartFilter.value === value
    ? null
    : { type: type, value: value };
}

function buildMetricDatasets_(rows) {
  return getMetricDefinitions_().map(function(def) {
    var isLine = def.type === 'line' || def.key === 'target';
    return {
      label: def.label || def.key,
      data: rows.map(function(row) { return Number(row[def.key]) || 0; }),
      type: isLine ? 'line' : 'bar',
      borderColor: def.color || '#5f6368',
      backgroundColor: isLine ? 'transparent' : ((def.color || '#5f6368') + '66'),
      borderWidth: isLine ? 2 : 1,
      borderDash: def.dash ? [8, 4] : [],
      pointRadius: isLine ? 0 : undefined,
      tension: 0
    };
  });
}

function buildChartOptions_() {
  return {
    responsive: true,
    maintainAspectRatio: false,
    plugins: {
      legend: { position: 'top' }
    },
    onHover: function(evt, elements) {
      if (evt && evt.native && evt.native.target) {
        evt.native.target.style.cursor = elements.length ? 'pointer' : 'default';
      }
    },
    scales: {
      y: {
        ticks: {
          callback: function(value) {
            return Number(value).toLocaleString('ja-JP');
          }
        }
      }
    }
  };
}

function makeTargetTickPlugin_(pluginId, targets) {
  return {
    id: pluginId,
    afterDatasetsDraw: function(chartInstance) {
      var bars = chartInstance.data.datasets
        .map(function(_, idx) { return chartInstance.getDatasetMeta(idx); })
        .filter(function(meta) { return meta.type === 'bar'; });
      if (!bars.length || !targets.length) return;
      var ctx = chartInstance.ctx;
      ctx.save();
      ctx.strokeStyle = '#ea4335';
      ctx.lineWidth = 3;
      targets.forEach(function(value, index) {
        var y = chartInstance.scales.y.getPixelForValue(value);
        var centerX = chartInstance.scales.x.getPixelForValue(index);
        var bandHalf = chartInstance.scales.x.width / (chartInstance.data.labels.length * 2);
        ctx.beginPath();
        ctx.moveTo(centerX - bandHalf, y);
        ctx.lineTo(centerX + bandHalf, y);
        ctx.stroke();
      });
      ctx.restore();
    }
  };
}

function renderDeals() {
  var area = document.getElementById('dealArea');
  if (!area || !D || !D.weeks.length) return;
  renderFilterChip_();

  var context = getDealContext_();
  var cacheKey = [currentDivision, context.week, context.dept, selectedPeriod || ''].join('|');
  if (dealErrorCache[cacheKey]) {
    area.innerHTML = '<div class="empty-state">Key Deal 取得エラー: ' + escapeHtml_(dealErrorCache[cacheKey]) + '</div>';
    return;
  }
  if (!dealCache[cacheKey]) {
    if (loadingDealKey !== cacheKey) loadDeals_(cacheKey, context);
    area.innerHTML = '<div class="empty-state">Key Deal を読み込み中...</div>';
    return;
  }

  var deals = dealCache[cacheKey].slice();
  if (!deals.length) {
    area.innerHTML = '<div class="empty-state">Key Deal はありません</div>';
    return;
  }

  if (dealSortKey) {
    deals.sort(function(left, right) {
      var a = left[dealSortKey];
      var b = right[dealSortKey];
      if (typeof a === 'string') a = a.toLowerCase();
      if (typeof b === 'string') b = b.toLowerCase();
      if (a < b) return dealSortAsc ? -1 : 1;
      if (a > b) return dealSortAsc ? 1 : -1;
      return 0;
    });
  }

  var html = '<div class="deal-scroll"><table class="deal-table"><thead><tr>' +
    sortTh_('dept', '部署') +
    sortTh_('company', '会社名') +
    sortTh_('mrr', 'MRR') +
    sortTh_('phase', 'フェーズ') +
    sortTh_('yomi', 'ヨミ') +
    sortTh_('completedMonth', '完了予定月') +
    '</tr></thead><tbody>';
  deals.forEach(function(deal) {
    var rowClass = deal.mrr > 0 ? 'pos' : (deal.mrr < 0 ? 'neg' : '');
    html += '<tr class="' + rowClass + '">' +
      '<td>' + escapeHtml_(deal.dept || '') + '</td>' +
      '<td>' + escapeHtml_(deal.company || '') + '</td>' +
      '<td class="' + valClass_(deal.mrr) + '">' + escapeHtml_(fmt(deal.mrr)) + '</td>' +
      '<td>' + escapeHtml_(deal.phase || '') + '</td>' +
      '<td class="' + valClass_(deal.yomi) + '">' + escapeHtml_(fmt(deal.yomi)) + '</td>' +
      '<td>' + escapeHtml_(deal.completedMonth || '') + '</td>' +
    '</tr>';
  });
  html += '</tbody></table></div>';
  area.innerHTML = html;
}

function getDealContext_() {
  var week = currentView === 'weekly'
    ? ((chartFilter && chartFilter.type === 'week' && chartFilter.value) || D.weeks[D.weeks.length - 1])
    : getSelectedWeek_();
  var dept = D.allLabel;
  if (currentView === 'weekly') {
    dept = getSelectedDept_();
  } else if (chartFilter && chartFilter.type === 'dept') {
    dept = chartFilter.value;
  }
  return { week: week, dept: dept };
}

function loadDeals_(cacheKey, context) {
  loadingDealKey = cacheKey;
  google.script.run
    .withSuccessHandler(function(result) {
      dealCache[cacheKey] = Array.isArray(result && result.deals) ? result.deals : [];
      delete dealErrorCache[cacheKey];
      loadingDealKey = '';
      renderDeals();
    })
    .withFailureHandler(function(err) {
      dealCache[cacheKey] = [];
      dealErrorCache[cacheKey] = getErrorMessage_(err);
      loadingDealKey = '';
      renderDeals();
    })
    .getMrrDashboardDeals(currentDivision, context.week, context.dept, selectedPeriod || '');
}

function renderFilterChip_() {
  var chip = document.getElementById('filterChip');
  if (!chip) return;
  if (!chartFilter) {
    chip.innerHTML = '';
    return;
  }
  chip.innerHTML =
    '<span class="filter-chip-badge">' +
      'フィルタ中: ' + escapeHtml_(chartFilter.value) +
      '<button type="button" class="filter-chip-clear" onclick="clearChartFilter_()" aria-label="フィルタ解除">×</button>' +
    '</span>';
}

function clearChartFilter_() {
  chartFilter = null;
  renderDeals();
}

function sortTh_(key, label) {
  var indicator = '';
  if (dealSortKey === key) indicator = dealSortAsc ? ' ▲' : ' ▼';
  return '<th onclick="setSortKey(\'' + key + '\')">' + escapeHtml_(label + indicator) + '</th>';
}

function setSortKey(key) {
  if (dealSortKey === key) {
    dealSortAsc = !dealSortAsc;
  } else {
    dealSortKey = key;
    dealSortAsc = true;
  }
  renderDeals();
}

function fmt(v) {
  var num = Number(v) || 0;
  return (num < 0 ? '-' : '') + Math.abs(num).toLocaleString('ja-JP');
}

function valClass_(v) {
  var num = Number(v) || 0;
  if (num > 0) return 'val-pos';
  if (num < 0) return 'val-neg';
  return 'val-neutral';
}

function getMrrPeriodLabel_(periodKey) {
  var key = String(periodKey || '');
  var options = D && D.periodOptions || [];
  for (var i = 0; i < options.length; i++) {
    var option = options[i] || {};
    if (option.key === key) return option.label || key;
    if ((option.months || []).indexOf(key) !== -1) return formatMrrMonthLabel_(key);
  }
  return key;
}

function formatMrrMonthLabel_(monthKey) {
  var match = String(monthKey || '').match(/^(\d{4})-(\d{2})$/);
  if (!match) return String(monthKey || '');
  return Number(match[2]) + '月';
}

function escapeHtml_(value) {
  return String(value === null || value === undefined ? '' : value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function escapeJsString_(value) {
  return String(value === null || value === undefined ? '' : value)
    .replace(/\\/g, '\\\\')
    .replace(/'/g, "\\'")
    .replace(/\r/g, '\\r')
    .replace(/\n/g, '\\n');
}

bootstrap_();
</script>
</body>
</html>
