<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MRR進捗ダッシュボード</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #eef3f8;
    --panel: #ffffff;
    --ink: #172033;
    --muted: #64748b;
    --line: #d9e2ee;
    --blue: #2563eb;
    --shadow: 0 18px 48px rgba(30, 41, 59, .10);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    color: var(--ink);
    background:
      radial-gradient(circle at top left, rgba(37,99,235,.16), transparent 30rem),
      linear-gradient(135deg, #f8fbff 0%, var(--bg) 50%, #f5f0e8 100%);
    font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
  }
  .topbar {
    position: sticky;
    top: 0;
    z-index: 3;
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 14px 22px;
    background: rgba(255,255,255,.86);
    border-bottom: 1px solid var(--line);
    backdrop-filter: blur(14px);
  }
  h1 { margin: 0; font-size: 21px; color: var(--blue); white-space: nowrap; }
  .seg, .selectors { display: inline-flex; align-items: center; gap: 8px; }
  .seg { padding: 4px; background: #e8eef8; border-radius: 999px; }
  .tab {
    border: 0;
    border-radius: 999px;
    padding: 8px 16px;
    background: transparent;
    color: #334155;
    font-weight: 700;
    cursor: pointer;
  }
  .tab.active { background: var(--blue); color: #fff; box-shadow: 0 8px 22px rgba(37,99,235,.28); }
  .selectors { margin-left: auto; flex-wrap: wrap; justify-content: flex-end; }
  label { font-size: 12px; color: var(--muted); font-weight: 700; }
  select {
    min-width: 132px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: #fff;
    padding: 8px 10px;
    color: var(--ink);
  }
  .shell { width: min(1500px, calc(100vw - 32px)); margin: 20px auto 28px; }
  .status {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    background: rgba(255,255,255,.78);
    color: var(--blue);
    font-weight: 700;
    z-index: 10;
  }
  .status.hidden { display: none; }
  .meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 14px;
    color: var(--muted);
    font-size: 12px;
  }
  .cards {
    display: grid;
    grid-template-columns: repeat(5, minmax(150px, 1fr));
    gap: 14px;
    margin-bottom: 18px;
  }
  .card {
    background: rgba(255,255,255,.92);
    border: 1px solid rgba(217,226,238,.84);
    border-radius: 18px;
    padding: 16px;
    box-shadow: var(--shadow);
  }
  .card .label { color: var(--muted); font-size: 12px; font-weight: 700; margin-bottom: 8px; }
  .card .value { font-size: 26px; font-weight: 800; letter-spacing: -.02em; }
  .neg { color: #dc2626; }
  .pos { color: #0f766e; }
  .chart-panel, .deal-panel {
    background: rgba(255,255,255,.92);
    border: 1px solid rgba(217,226,238,.84);
    border-radius: 22px;
    box-shadow: var(--shadow);
  }
  .chart-panel { padding: 18px; margin-bottom: 18px; }
  .chart-panel canvas { max-height: 430px; }
  .deal-panel { overflow: hidden; }
  .deal-head {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 16px 18px;
    border-bottom: 1px solid var(--line);
  }
  .deal-head h2 { margin: 0; font-size: 16px; }
  .deal-scroll { max-height: 340px; overflow: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 11px 14px; border-bottom: 1px solid #edf2f7; text-align: left; font-size: 13px; }
  th { position: sticky; top: 0; background: #f8fafc; z-index: 1; color: #475569; }
  tr.negative { background: #fff6f6; }
  tr.positive { background: #f3fbf8; }
  .empty { padding: 28px; color: var(--muted); text-align: center; }
  @media (max-width: 980px) {
    .topbar { align-items: flex-start; flex-direction: column; }
    .selectors { margin-left: 0; justify-content: flex-start; }
    .cards { grid-template-columns: repeat(2, minmax(140px, 1fr)); }
  }
</style>
</head>
<body>
<div id="loading" class="status">データを読み込み中...</div>

<header class="topbar">
  <h1>MRR進捗ダッシュボード</h1>
  <div id="divisionTabs" class="seg"></div>
  <div class="seg">
    <button class="tab active" data-view="weekly" onclick="switchView('weekly')">週次</button>
    <button class="tab" data-view="dept" onclick="switchView('dept')">部署別</button>
  </div>
  <div class="selectors">
    <label for="periodSelect">期間</label>
    <select id="periodSelect" onchange="selectPeriod(this.value)"></select>
    <label id="deptLabel" for="deptSelect">部署</label>
    <select id="deptSelect" onchange="selectDept(this.value)"></select>
    <label id="weekLabel" for="weekSelect">週</label>
    <select id="weekSelect" onchange="selectWeek(this.value)"></select>
  </div>
</header>

<main class="shell">
  <div class="meta">
    <span id="sourceText">source: snapshot</span>
    <span id="generatedText"></span>
  </div>
  <section id="cards" class="cards"></section>
  <section class="chart-panel"><canvas id="mainChart"></canvas></section>
  <section class="deal-panel">
    <div class="deal-head">
      <h2>Key Deal</h2>
      <span id="dealCount" class="meta-text"></span>
    </div>
    <div id="dealArea" class="deal-scroll"></div>
  </section>
</main>

<script>
var D = null;
var currentDivision = '';
var currentView = 'weekly';
var currentPeriod = '';
var currentDept = '';
var currentWeek = '';
var chart = null;

google.script.run
  .withSuccessHandler(function(result) {
    D = result || {};
    currentDivision = D.defaultDivision || ((D.divisions && D.divisions[0] && D.divisions[0].key) || '');
    buildDivisionTabs();
    syncSelectors();
    document.getElementById('loading').classList.add('hidden');
    render();
  })
  .withFailureHandler(function(err) {
    var msg = err && err.message ? err.message : String(err || 'unknown error');
    document.getElementById('loading').textContent = 'エラー: ' + msg;
  })
  .getMrrDashboardData();

function division() {
  return (D.divisions || []).filter(function(item) { return item.key === currentDivision; })[0] || null;
}

function metricDefs() {
  return (D && D.metrics) || [];
}

function totalKey() {
  return (D && D.totalKey) || 'total';
}

function buildDivisionTabs() {
  var area = document.getElementById('divisionTabs');
  area.innerHTML = (D.divisions || []).map(function(item) {
    return '<button class="tab' + (item.key === currentDivision ? ' active' : '') + '" onclick="selectDivision(\'' + escAttr(item.key) + '\')">' + esc(item.label) + '</button>';
  }).join('');
}

function syncSelectors() {
  var div = division();
  if (!div) return;
  if (!currentPeriod || !(div.periods || []).some(function(p) { return p.key === currentPeriod; })) {
    currentPeriod = div.defaultPeriod || ((div.periods || [])[0] && div.periods[0].key) || '';
  }
  var deptOptions = [{ key: totalKey(), label: div.totalLabel || (div.label + '全体') }].concat(div.depts || []);
  if (!currentDept || !deptOptions.some(function(d) { return d.key === currentDept; })) currentDept = totalKey();
  if (!currentWeek || !(div.weeks || []).some(function(w) { return w.key === currentWeek; })) {
    currentWeek = (div.weeks || []).length ? div.weeks[div.weeks.length - 1].key : '';
  }

  fillSelect('periodSelect', div.periods || [], currentPeriod);
  fillSelect('deptSelect', deptOptions, currentDept);
  fillSelect('weekSelect', div.weeks || [], currentWeek, function(w) { return w.label + ' (' + w.date + ')'; });
  document.getElementById('deptSelect').style.display = currentView === 'weekly' ? '' : 'none';
  document.getElementById('deptLabel').style.display = currentView === 'weekly' ? '' : 'none';
  document.getElementById('weekSelect').style.display = currentView === 'dept' ? '' : 'none';
  document.getElementById('weekLabel').style.display = currentView === 'dept' ? '' : 'none';
  document.getElementById('sourceText').textContent = 'source: ' + (D.source || 'snapshot');
  document.getElementById('generatedText').textContent = D.generatedAt ? 'generated: ' + D.generatedAt : '';
}

function fillSelect(id, items, value, labelFn) {
  var select = document.getElementById(id);
  select.innerHTML = (items || []).map(function(item) {
    var label = labelFn ? labelFn(item) : (item.label || item.key);
    return '<option value="' + escAttr(item.key) + '"' + (item.key === value ? ' selected' : '') + '>' + esc(label) + '</option>';
  }).join('');
}

function selectDivision(key) {
  currentDivision = key;
  currentDept = '';
  currentWeek = '';
  currentPeriod = '';
  buildDivisionTabs();
  syncSelectors();
  render();
}

function switchView(view) {
  currentView = view;
  document.querySelectorAll('[data-view]').forEach(function(tab) {
    tab.classList.toggle('active', tab.dataset.view === view);
  });
  syncSelectors();
  render();
}

function selectPeriod(key) { currentPeriod = key; render(); }
function selectDept(key) { currentDept = key; render(); }
function selectWeek(key) { currentWeek = key; render(); }

function selectedRowsByWeek() {
  var div = division();
  return (((div || {}).data || {})[currentPeriod] || {});
}

function selectedMetricRow(weekKey, deptKey) {
  var rows = selectedRowsByWeek()[weekKey] || {};
  return rows[deptKey] || emptyMetrics();
}

function emptyMetrics() {
  var row = {};
  metricDefs().forEach(function(def) { row[def.key] = 0; });
  return row;
}

function activeMetricKeys() {
  var div = division();
  if (!div) return [];
  var keys = [];
  var data = selectedRowsByWeek();
  metricDefs().forEach(function(def) {
    var hasValue = false;
    (div.weeks || []).forEach(function(week) {
      var row = selectedMetricRow(week.key, currentView === 'weekly' ? currentDept : totalKey());
      if (num(row[def.key]) !== 0) hasValue = true;
    });
    if (hasValue || ['target', 'confirmed', 'fcstAdjusted', 'fcstCommit', 'expectedMrr'].indexOf(def.key) !== -1) keys.push(def.key);
  });
  return keys;
}

function render() {
  if (!D) return;
  syncSelectors();
  renderCards();
  renderChart();
  renderDeals();
}

function renderCards() {
  var div = division();
  if (!div) {
    document.getElementById('cards').innerHTML = '<div class="card"><div class="label">データ</div><div class="value">なし</div></div>';
    return;
  }
  var weekKey = currentView === 'weekly' ? ((div.weeks || []).slice(-1)[0] || {}).key : currentWeek;
  var deptKey = currentView === 'weekly' ? currentDept : totalKey();
  var row = selectedMetricRow(weekKey, deptKey);
  document.getElementById('cards').innerHTML = activeMetricKeys().map(function(key) {
    var def = metricDefs().filter(function(m) { return m.key === key; })[0] || { label: key };
    var value = num(row[key]);
    return '<div class="card"><div class="label">' + esc(def.label) + '</div><div class="value ' + cls(value) + '">' + fmt(value) + '</div></div>';
  }).join('');
}

function renderChart() {
  if (chart) chart.destroy();
  var div = division();
  if (!div) return;
  var ctx = document.getElementById('mainChart').getContext('2d');
  var metricKeys = activeMetricKeys();
  var labels;
  var datasets;

  if (currentView === 'weekly') {
    labels = (div.weeks || []).map(function(w) { return w.label; });
    datasets = metricKeys.map(function(key) {
      var def = metricDefs().filter(function(m) { return m.key === key; })[0] || { label: key, color: '#94a3b8' };
      return {
        label: def.label,
        data: (div.weeks || []).map(function(w) { return num(selectedMetricRow(w.key, currentDept)[key]); }),
        borderColor: def.color,
        backgroundColor: colorWithAlpha(def.color, .58),
        borderWidth: 1
      };
    });
  } else {
    labels = (div.depts || []).map(function(d) { return d.label; });
    datasets = metricKeys.map(function(key) {
      var def = metricDefs().filter(function(m) { return m.key === key; })[0] || { label: key, color: '#94a3b8' };
      return {
        label: def.label,
        data: (div.depts || []).map(function(d) { return num(selectedMetricRow(currentWeek, d.key)[key]); }),
        borderColor: def.color,
        backgroundColor: colorWithAlpha(def.color, .58),
        borderWidth: 1
      };
    });
  }

  chart = new Chart(ctx, {
    type: 'bar',
    data: { labels: labels, datasets: datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { position: 'top', labels: { boxWidth: 14 } } },
      scales: {
        y: { ticks: { callback: function(v) { return Number(v).toLocaleString('ja-JP'); } } }
      }
    }
  });
}

function renderDeals() {
  var div = division();
  if (!div) {
    document.getElementById('dealCount').textContent = '0件';
    document.getElementById('dealArea').innerHTML = '<div class="empty">スナップショットデータがありません</div>';
    return;
  }
  var weekKey = currentView === 'weekly' ? ((div.weeks || []).slice(-1)[0] || {}).key : currentWeek;
  var deptKey = currentView === 'weekly' ? currentDept : totalKey();
  var deals = ((((div || {}).deals || {})[weekKey] || {})[deptKey] || []);
  document.getElementById('dealCount').textContent = deals.length + '件';

  if (!deals.length) {
    document.getElementById('dealArea').innerHTML = '<div class="empty">Key Deal はありません</div>';
    return;
  }

  var rows = deals.map(function(deal) {
    var rowClass = num(deal.mrr) < 0 ? 'negative' : (num(deal.mrr) > 0 ? 'positive' : '');
    return '<tr class="' + rowClass + '">' +
      '<td>' + esc(deal.deptLabel || deal.deptKey || '') + '</td>' +
      '<td>' + esc(deal.company || '') + '</td>' +
      '<td class="' + cls(deal.mrr) + '">' + fmt(deal.mrr) + '</td>' +
      '<td>' + esc(deal.phase || '') + '</td>' +
      '<td class="' + cls(deal.fcstCommit) + '">' + fmt(deal.fcstCommit) + '</td>' +
      '<td>' + esc(deal.forecast || '') + '</td>' +
      '<td>' + esc(deal.completedMonth || '') + '</td>' +
    '</tr>';
  }).join('');

  document.getElementById('dealArea').innerHTML =
    '<table><thead><tr><th>部署</th><th>会社名</th><th>MRR</th><th>フェーズ</th><th>FCST(コミット)</th><th>フォーキャスト</th><th>完了予定月</th></tr></thead><tbody>' +
    rows +
    '</tbody></table>';
}

function fmt(value) {
  var n = num(value);
  return (n < 0 ? '-' : '') + Math.abs(Math.round(n)).toLocaleString('ja-JP');
}

function num(value) {
  var n = Number(value);
  return isNaN(n) ? 0 : n;
}

function cls(value) {
  return num(value) < 0 ? 'neg' : 'pos';
}

function colorWithAlpha(hex, alpha) {
  var m = String(hex || '').match(/^#?([0-9a-f]{6})$/i);
  if (!m) return 'rgba(148,163,184,' + alpha + ')';
  var raw = m[1];
  var r = parseInt(raw.slice(0, 2), 16);
  var g = parseInt(raw.slice(2, 4), 16);
  var b = parseInt(raw.slice(4, 6), 16);
  return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
}

function esc(value) {
  return String(value == null ? '' : value).replace(/[&<>"']/g, function(c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function escAttr(value) {
  return esc(value);
}
</script>
</body>
</html>
